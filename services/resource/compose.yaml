services:

  resource_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ResourceDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ResourceDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: resource_db
    volumes:
      - resource_db_data:/var/lib/postgresql/data
    networks:
      - app_network

  resource_redis:
    image: redis:alpine
    container_name: resource_redis
    command: redis-server --requirepass 1111
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1111", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  resource_service:
    environment:
      DB_HOST: resource_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: 1111
      DB_NAME: ResourceDB
      IS_TEST_DB: ${IS_TEST_DB:-False}
      PUBLIC_KEY_HEX: 49c1b751feea9bc7d9509705d0090c3ebd1f417ec0e64145e8e6e960f515b586
      REDIS_PASSWORD: 1111
    build:
      context: .
      target: ${BUILD_TARGET}
    container_name: resource_service
    depends_on:
      resource_redis:
        condition: service_healthy 
      resource_db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && fastapi dev app/main.py --host 0.0.0.0 --port 8082"
    volumes:
      - .:/project
    networks:
      - app_network

volumes:
  resource_db_data:

networks:
  app_network:
    driver: bridge


